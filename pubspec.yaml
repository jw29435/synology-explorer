name: synology_explorer
description: "Flutter-Client für Synology NAS (File Station), Fokus Audio-Wiedergabe."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.35.0
  flutter_secure_storage: ^11.2.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  media_kit: ^1.2.6
  photo_view: ^0.15.0
  pdfrx: ^2.6.5
  google_fonts: ^8.2.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.1
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  gal: ^2.3.3
  screen_brightness: ^2.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  re_highlight: ^0.0.3
  archive: ^4.3.0
  xml: ^7.0.1
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  shelf: ^1.4.2
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # google_fonts findet die Dateien hier; Laden aus dem Netz ist abgeschaltet.
    - assets/fonts/
