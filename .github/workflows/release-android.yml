name: Release Android

# Tag v* (von Hand oder über release-please) → signierte APKs und das AAB
# als GitHub-Release-Assets, das AAB zusätzlich im Play-Internal-Track.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release-Tag, z. B. v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release-Tag, z. B. v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Secrets prüfen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KEY_PROPERTIES" ] || missing+=(KEY_PROPERTIES)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Signing-Secrets fehlen::${missing[*]} in Settings › Secrets and variables › Actions anlegen (siehe README, Abschnitt Release)."
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning title=Kein Play-Upload::PLAY_SERVICE_ACCOUNT_JSON fehlt – APKs landen nur im GitHub-Release."
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Ungültiger Tag::$TAG ist kein SemVer-Tag vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # Volle Historie für die Build-Nummer (Commit-Zahl, siehe unten).
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version aus Tag setzen
        run: |
          version="${TAG#v}"
          # Build-Nummer = Zahl der Commits bis zum Tag: steigt mit jedem
          # Release, egal ob per Tag-Push, Dispatch oder release-please
          # (run_number gehört je nach Weg zu einem anderen Workflow).
          build="$(git rev-list --count HEAD)"
          sed -i -E "s/^version: .*/version: ${version}+${build}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Keystore aus Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # KEY_PROPERTIES: storePassword, keyPassword, keyAlias; storeFile
          # zeigt immer auf die eben geschriebene Datei.
          printf '%s\n' "$KEY_PROPERTIES" | grep -v '^storeFile=' > android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release

      - name: Signatur prüfen (nicht mit dem Debug-Key)
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          if "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -q 'CN=Android Debug'; then
            echo "::error::APK ist mit dem Debug-Key signiert – key.properties prüfen."
            exit 1
          fi

      # AAB zusätzlich als Download, z. B. für den manuellen Upload in die
      # Play Console, solange kein Service-Account hinterlegt ist.
      - name: APKs und AAB ins GitHub-Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab

      - name: AAB in den Play-Internal-Track
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.jw29435.nuvo_explorer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          # Solange die App in der Play Console noch ein Entwurf ist, nimmt
          # Play nur Entwürfe an: Repo-Variable PLAY_RELEASE_STATUS=draft.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Signing-Dateien entfernen
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
